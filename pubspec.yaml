name: meal_planning_app
description: "AI-powered meal planning mobile application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.0.0
  flutter_dotenv: ^5.2.1
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Networking
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # Camera & Image
  camera: ^0.10.5+9
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  flutter_image_compress: ^2.2.0

  # UI Components
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  lottie: ^3.0.0

  # Charts & Analytics
  fl_chart: ^0.66.1
  syncfusion_flutter_charts: ^24.2.9

  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^7.0.1
  local_auth: ^2.1.7

  # Search & Voice
  flutter_typeahead: ^5.0.2
  speech_to_text: ^7.3.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.2.1
  url_launcher: ^6.2.2
  share_plus: ^7.2.2
  connectivity_plus: ^5.0.2
  package_info_plus: ^9.0.0

  # Icons
  cupertino_icons: ^1.0.8
  


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/branding/meal_planner_icon.png

