apiVersion: apps/v1
kind: Deployment
metadata:
  name: meal-planning-api
  labels:
    app: meal-planning-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: meal-planning-api
  template:
    metadata:
      labels:
        app: meal-planning-api
    spec:
      containers:
      - name: api
        image: meal-planning-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: redis-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: secret-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: meal-planning-api
spec:
  selector:
    app: meal-planning-api
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meal-planning-api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.mealplanning.com
    secretName: meal-planning-tls
  rules:
  - host: api.mealplanning.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: meal-planning-api
            port:
              number: 80